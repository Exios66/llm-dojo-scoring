version: 2.1

# Free-tier CircleCI gate for the Dojo (shared scoring engine for llm-mailroom
# and local-mailroom-sandbox, so a red main here breaks both). Same service and
# shape as local-mailroom-sandbox/.circleci/config.yml. Runs on every push and
# PR automatically once the repo is followed in CircleCI; to BLOCK merges, mark
# the "ci/circleci: lint" and "ci/circleci: test" checks as required in the
# GitHub branch protection rule for main.

executors:
  py:
    parameters:
      version:
        type: string
        default: "3.11"
    docker:
      - image: cimg/python:<< parameters.version >>
    resource_class: small

jobs:
  lint:
    executor: py
    steps:
      - checkout
      - run:
          name: Install ruff
          command: pip install --quiet ruff
      - run:
          name: ruff (correctness gate, config in pyproject.toml)
          command: ruff check llm_dojo_scoring tests scripts examples

  test:
    parameters:
      version:
        type: string
    executor:
      name: py
      version: << parameters.version >>
    steps:
      - checkout
      - run:
          # tests/test_release_tools.py runs `git log vX.Y.Z..HEAD`, so it
          # needs tags and full history.
          name: Fetch tags and full history
          command: git fetch --tags --force && (git fetch --unshallow 2>/dev/null || true)
      - restore_cache:
          keys:
            - pip-v1-<< parameters.version >>-{{ checksum "pyproject.toml" }}
      - run:
          name: Install (dev extra)
          command: pip install -e ".[dev]"
      - save_cache:
          key: pip-v1-<< parameters.version >>-{{ checksum "pyproject.toml" }}
          paths:
            - ~/.cache/pip
      - run:
          name: Release chain is consistent (version / changelog / pins)
          command: python scripts/release.py check
      - run:
          name: Pytest (network-free)
          command: python -m pytest tests -q --junitxml=test-results/junit.xml
      - store_test_results:
          path: test-results

workflows:
  ci:
    jobs:
      - lint
      - test:
          matrix:
            parameters:
              version: ["3.11", "3.12"]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-labelledby="t d" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace">
  <title id="t">~/llm-dojo-scoring — dojo-analyze</title>
  <desc id="d">Dashboard: what the scoring engine ships (27 agent profiles, 11 task bundles, tiers T0 to T3, four command-line tools) and a sample run with its Wilson interval.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b2e"/></linearGradient><linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
  <style>@media (prefers-reduced-motion: reduce){.motion{display:none}}</style>
  <rect x="1" y="1" width="898" height="338" rx="16" fill="url(#bg)" stroke="#30363d" stroke-width="2"/>
  <rect x="1" y="1" width="898" height="44" rx="16" fill="#1c2230"/><rect x="1" y="30" width="898" height="15" fill="#1c2230"/>
  <circle cx="30" cy="23" r="7" fill="#ff5f57"/><circle cx="54" cy="23" r="7" fill="#febc2e"/><circle cx="78" cy="23" r="7" fill="#28c840"/>
  <text x="450" y="28" text-anchor="middle" font-size="13" fill="#8b949e">~/llm-dojo-scoring — dojo-analyze</text>
  <rect x="24" y="66" width="420" height="210" rx="8" fill="none" stroke="#3b4660" stroke-width="1.5"/>
  <rect x="38" y="57" width="88" height="18" fill="#12182a"/>
<text x="46" y="70" font-size="12" fill="#8b9bb4" font-weight="700" letter-spacing="1.5">REGISTRY</text>
  <rect x="460" y="66" width="416" height="210" rx="8" fill="none" stroke="#3b4660" stroke-width="1.5"/>
  <rect x="474" y="57" width="106" height="18" fill="#12182a"/>
<text x="482" y="70" font-size="12" fill="#8b9bb4" font-weight="700" letter-spacing="1.5">SAMPLE RUN</text>
<text x="40" y="104" font-size="13" fill="#94a3b8">agent profiles</text>
<circle cx="180" cy="100" r="5" fill="#38bdf8"/>
<text x="194" y="104" font-size="13" fill="#e2e8f0" font-weight="700">27</text>
<text x="40" y="138" font-size="13" fill="#94a3b8">task bundles</text>
<circle cx="180" cy="134" r="5" fill="#a78bfa"/>
<text x="194" y="138" font-size="13" fill="#e2e8f0" font-weight="700">11</text>
<text x="40" y="172" font-size="13" fill="#94a3b8">metric tiers</text>
<circle cx="180" cy="168" r="5" fill="#a3e635"/>
<text x="194" y="172" font-size="13" fill="#e2e8f0" font-weight="700">T0 → T3</text>
<text x="40" y="206" font-size="13" fill="#94a3b8">CLI tools</text>
<circle cx="180" cy="202" r="5" fill="#f472b6"/>
<text x="194" y="206" font-size="13" fill="#e2e8f0" font-weight="700">4</text>
<text x="40" y="240" font-size="13" fill="#94a3b8">core needs</text>
<circle cx="180" cy="236" r="5" fill="#22c55e"/>
<text x="194" y="240" font-size="13" fill="#e2e8f0" font-weight="700">no API key</text>
<rect x="474" y="90" width="50" height="19" rx="4" fill="#79c0ff" fill-opacity=".16"/>
<text x="499" y="104" font-size="11" fill="#79c0ff" font-weight="700" text-anchor="middle">INFO</text>
<text x="534" y="104" font-size="13" fill="#c9d1d9">dojo-analyze --target 0.94 --min-n 100</text>
<rect x="474" y="118" width="50" height="19" rx="4" fill="#7ee787" fill-opacity=".16"/>
<text x="499" y="132" font-size="11" fill="#7ee787" font-weight="700" text-anchor="middle">OK</text>
<text x="534" y="132" font-size="13" fill="#c9d1d9">score_task exact match 2 / 3</text>
<rect x="474" y="146" width="50" height="19" rx="4" fill="#79c0ff" fill-opacity=".16"/>
<text x="499" y="160" font-size="11" fill="#79c0ff" font-weight="700" text-anchor="middle">INFO</text>
<text x="534" y="160" font-size="13" fill="#c9d1d9">Wilson 95% interval 0.21–0.94</text>
<rect x="474" y="174" width="50" height="19" rx="4" fill="#e3b341" fill-opacity=".16"/>
<text x="499" y="188" font-size="11" fill="#e3b341" font-weight="700" text-anchor="middle">WARN</text>
<text x="534" y="188" font-size="13" fill="#c9d1d9">n = 3: the interval is wide, trust it</text>
<rect x="474" y="202" width="50" height="19" rx="4" fill="#7ee787" fill-opacity=".16"/>
<text x="499" y="216" font-size="11" fill="#7ee787" font-weight="700" text-anchor="middle">OK</text>
<text x="534" y="216" font-size="13" fill="#c9d1d9">report + plots beside the workbook</text>
<rect class="motion" x="466" y="88" width="404" height="24" rx="5" fill="#ffffff" opacity=".07"><animate attributeName="y" values="88;200;88" dur="6.0s" repeatCount="indefinite"/></rect>
  <rect x="24" y="290" width="852" height="30" rx="6" fill="#1c2230"/>
<text x="40" y="310" font-size="12.5" fill="#8b949e">deterministic core · offline · optional Langfuse and Phoenix sinks</text>
<g class="motion" transform="translate(856 305)"><circle r="7" fill="none" stroke="#30363d" stroke-width="2.5"/><path d="M0 -7 A7 7 0 0 1 7 0" fill="none" stroke="#7ee787" stroke-width="2.5" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.1s" repeatCount="indefinite"/></path></g>
</svg>

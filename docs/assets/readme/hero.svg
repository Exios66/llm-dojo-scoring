<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-labelledby="title desc" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
<title id="title">LLM Dojo Scoring</title><desc id="desc">Ground truth and predictions converge on field-type-aware alignment and scoring. Task suites produce metrics and confidence intervals; diagnostics and export tools explain results in reports. Core deterministic scoring works offline.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset=".55" stop-color="#151036"/><stop offset="1" stop-color="#22103a"/></linearGradient><linearGradient id="heading"><stop stop-color="#7dd3fc"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#94a3b8" stroke-width="1.5"/></marker></defs>
<style>.cue{stroke-dasharray:6 22;animation:travel 4.5s linear 1}@keyframes travel{from{stroke-dashoffset:112}to{stroke-dashoffset:0}}@media(prefers-reduced-motion:reduce){.cue{animation:none}}</style>
<rect width="1200" height="480" rx="24" fill="url(#bg)"/>
<rect x=".5" y=".5" width="1199" height="479" rx="24" fill="none" stroke="#334155"/>
<text x="600" y="54" font-size="14" fill="#94a3b8" font-weight="700" text-anchor="middle">THE MAILROOM CONSTELLATION</text>
<text x="600" y="132" font-size="64" fill="url(#heading)" font-weight="800" text-anchor="middle">LLM Dojo Scoring</text>
<text x="600" y="181" font-size="23" fill="#cbd5e1" font-weight="400" text-anchor="middle">Compare predictions with evidence. Explain every score.</text>
<text x="600" y="220" font-size="14" fill="#94a3b8" font-weight="600" text-anchor="middle">SCORING · ERROR ANALYSIS · VISUALIZATION · INTERPRETATION</text>
<rect x="48" y="246" width="270" height="80" rx="14" fill="#111a2e" stroke="#38bdf8" stroke-opacity=".65"/><rect x="64" y="264" width="5" height="44" rx="2" fill="#38bdf8"/><text x="82" y="282" font-size="21" fill="#e2e8f0" font-weight="700" text-anchor="start">Ground truth</text><text x="82" y="309" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="start">expected fields + labels</text>
<rect x="48" y="344" width="270" height="80" rx="14" fill="#111a2e" stroke="#c084fc" stroke-opacity=".65"/><rect x="64" y="362" width="5" height="44" rx="2" fill="#c084fc"/><text x="82" y="380" font-size="21" fill="#e2e8f0" font-weight="700" text-anchor="start">Prediction</text><text x="82" y="407" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="start">observed fields + labels</text>
<path d="M318 286 H370 V335 H420 M318 384 H370 V335" fill="none" stroke="#64748b" stroke-width="2"/>
<rect x="420" y="292" width="330" height="86" rx="14" fill="#111a2e" stroke="#f472b6" stroke-opacity=".65"/><rect x="436" y="310" width="5" height="50" rx="2" fill="#f472b6"/><text x="454" y="328" font-size="21" fill="#e2e8f0" font-weight="700" text-anchor="start">Field-type matcher</text><text x="454" y="355" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="start">normalize · align · compare</text>
<path d="M750 335 L825 335" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/><path class="cue" d="M750 335 L825 335" fill="none" stroke="#7dd3fc" stroke-width="2"/>
<rect x="825" y="246" width="327" height="80" rx="14" fill="#111a2e" stroke="#22c55e" stroke-opacity=".65"/><rect x="841" y="264" width="5" height="44" rx="2" fill="#22c55e"/><text x="859" y="282" font-size="21" fill="#e2e8f0" font-weight="700" text-anchor="start">Metrics + intervals</text><text x="859" y="309" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="start">task suites · uncertainty</text>
<rect x="825" y="344" width="327" height="80" rx="14" fill="#111a2e" stroke="#38bdf8" stroke-opacity=".65"/><rect x="841" y="362" width="5" height="44" rx="2" fill="#38bdf8"/><text x="859" y="380" font-size="21" fill="#e2e8f0" font-weight="700" text-anchor="start">Diagnostics + reports</text><text x="859" y="407" font-size="16" fill="#cbd5e1" font-weight="400" text-anchor="start">explain errors · export</text>
</svg>

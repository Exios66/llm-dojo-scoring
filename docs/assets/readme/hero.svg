<text x="600" y="44" font-size="13" fill="#8b9bb4" font-weight="700" text-anchor="middle" letter-spacing="3">THE MAILROOM CONSTELLATION · THE SCORING ENGINE</text><ellipse cx="600" cy="116" rx="420" ry="70" fill="url(#glow)" opacity=".18"/><text x="600" y="126" text-anchor="middle" font-size="70" font-weight="800" letter-spacing="-1.5" fill="url(#ttl)">LLM Dojo Scoring</text><text x="600" y="170" font-size="20" fill="#cbd5e1" text-anchor="middle">Score the extraction, not the vibes — field-aware metrics, honest intervals, failures explained.</text><text x="600" y="202" font-size="13" fill="#8b9bb4" font-weight="600" text-anchor="middle" letter-spacing="3">FIELD-TYPE-AWARE · DETERMINISTIC CORE · BOOTSTRAP + WILSON INTERVALS · FAILURE MODES</text><text x="90" y="244" font-size="11" fill="#8b9bb4" font-weight="700" letter-spacing="2">EXPECTED</text>

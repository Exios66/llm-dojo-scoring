[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-dojo-scoring"
version = "0.28.1"
description = "Dedicated scoring, error-analysis, visualization, and interpretation suite for LLM document pipelines (llm-mailroom / local-mailroom-sandbox)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "packaging>=23.2",  # PEP 440 release comparisons; no hand-rolled semver.
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "PyYAML>=6.0",
    "python-dateutil>=2.8.2",
    "openpyxl>=3.1.0",
    "matplotlib>=3.9.0",
    "scipy>=1.10.0",
    "structlog>=24.0",
    # Core with llm-mailroom: name-field Jaro–Winkler (field_scoring). Without
    # it matching silently falls back to difflib — keep mailroom scoring parity.
    "jellyfish>=1.0",
]

[project.optional-dependencies]
# Local / remote embedding rescue in field_scoring (sentence-transformers +
# OpenAI text-embedding-3-small). Matches mailroom[embeddings] / entity[embeddings].
embeddings = [
    "sentence-transformers>=3.0",
    "openai>=1.30",
]
# LangfuseSink (metrics/emitter.py). Matches mailroom core tracing (langfuse >=2.50).
tracing = [
    "langfuse>=2.50",
]
# jsonschema + pydantic: the schema-contract tests skip silently without them.
dev = ["pytest>=8.0", "pytest-mock>=3.14", "jsonschema>=4.0", "pydantic>=2.0"]
# MAUD catalog generation/replay against the pinned Hub dataset
# (scripts/gen_maud_catalog.py, scripts/verify_gt_penalties.py).
catalog = [
    "pyarrow>=15.0",
    "huggingface_hub>=0.23",
]
# Install surface used by the full mailroom + entity scoring path locally.
all = [
    "llm-dojo-scoring[embeddings,tracing,dev]",
]

[project.scripts]
dojo-version = "llm_dojo_scoring.integrations.update_awareness:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_dojo_scoring*"]
# packages/* are separate distributions (e.g. llm-dojo-pipeline, #83).
exclude = ["packages*"]

[tool.setuptools.package-data]
llm_dojo_scoring = ["prompts/*.yaml", "prompts/*.json", "prompts/templates/*.md", "schemas/data/*.json", "ml/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# Correctness-only gate (syntax errors, undefined names, mutable defaults,
# useless expressions, pylint errors). Deliberately excludes F401/F841: the
# package re-exports names on purpose and has ~50 pre-existing unused-import
# findings. Widen the set only together with a cleanup.
select = ["E9", "F63", "F7", "F82", "B006", "B018", "PLE"]
